// ── LOCK ──────────────────────────────────────────────────────
function Lock() {
  return <svg width="22" height="22" viewBox="0 0 40 40" fill="none">
    <rect x="8" y="18" width="24" height="18" rx="4" fill={INK} opacity="0.45" />
    <path d="M13 18V14A7 7 0 0127 14V18" stroke={INK} strokeWidth="3.5" fill="none" strokeLinecap="round" opacity="0.45" />
  </svg>;
}

// ── GRID CELL ─────────────────────────────────────────────────
function Cell({ item, selected, onClick }) {
  const rc = RC[item.rarity];
  const locked = !item.unlocked;

  return (
    <div onClick={() => onClick(item)} style={{
      position: 'relative', cursor: 'pointer',
      borderRadius: 10,
      border: `2px solid ${selected ? rc : locked ? 'rgba(17,78,85,0.1)' : 'rgba(17,78,85,0.18)'}`,
      background: locked ? 'rgba(17,78,85,0.05)' : 'rgba(0,0,0,0.07)',
      overflow: 'hidden',
      transition: 'border-color 0.15s, transform 0.12s, box-shadow 0.15s',
      transform: selected ? 'scale(1.04)' : 'scale(1)',
      boxShadow: selected ?
      `0 0 0 2px ${rc}, 0 4px 14px rgba(0,0,0,0.15)` :
      '0 2px 6px rgba(0,0,0,0.08)',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end'
    }}>
      {/* Rarity accent — tiny dot only */}
      <div style={{
        position: 'absolute', top: 5, right: 5,
        width: 4, height: 4, borderRadius: '50%',
        background: rc, opacity: locked ? 0.2 : 0.7
      }} />

      {/* Graphic */}
      <div style={{
        flex: 1, width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        paddingTop: 6, overflow: 'hidden',
        filter: locked ? 'grayscale(1) brightness(0.55)' : 'none'
      }}>
        <div style={{ transform: 'scale(0.62)', transformOrigin: 'center bottom' }}>
          <item.Gfx />
        </div>
      </div>

      {/* Lock */}
      {locked &&
      <div style={{
        position: 'absolute', top: '38%', left: '50%',
        transform: 'translate(-50%,-50%)'
      }}>
          <Lock />
        </div>
      }

      {/* Name strip */}
      <div style={{
        width: '100%', padding: '3px 5px 4px',
        background: 'rgba(17,78,85,0.12)',
        textAlign: 'center'
      }}>
        <div style={{
          fontFamily: 'Lilita One', fontSize: 7.5, lineHeight: 1.1,
          color: locked ? 'rgba(10,29,39,0.3)' : INK,
          whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'
        }}>
          {locked ? '???' : item.name}
        </div>
      </div>
    </div>);

}

// ── APP ───────────────────────────────────────────────────────
function App() {
  const [sel, setSel] = useState(ITEMS[0]);

  const unlocked = ITEMS.filter((i) => i.unlocked).length;
  const rc = RC[sel.rarity];
  const locked = !sel.unlocked;

  return (
    <div style={{
      width: 800, height: 360,
      background: BG,
      display: 'flex', flexDirection: 'column',
      overflow: 'hidden', fontFamily: '"Lilita One"'
    }}>

      {/* ── HEADER ── */}
      <div style={{
        height: 40, flexShrink: 0,
        display: 'flex', alignItems: 'center', padding: '0 14px', gap: 12,
        borderBottom: '1px solid rgba(17,78,85,0.1)'
      }}>
        {/* Back */}
        <button style={{
          width: 28, height: 28, borderRadius: 7, background: TEAL,
          border: 'none', cursor: 'pointer', flexShrink: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 2px 5px rgba(0,0,0,0.18)'
        }}>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M8 2.5L4.5 6L8 9.5" stroke={PAPER} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        </button>

        {/* Title */}
        <span style={{ fontFamily: 'Lilita One', fontSize: 17, color: INK, letterSpacing: '-0.01em', flexShrink: 0 }}>
          GUITARDEX
        </span>

        {/* Progress */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 2 }}>
          <div style={{ height: 4, background: 'rgba(17,78,85,0.1)', borderRadius: 2, overflow: 'hidden' }}>
            <div style={{
              height: '100%', borderRadius: 2,
              width: `${unlocked / ITEMS.length * 100}%`,
              background: `linear-gradient(90deg, ${TEAL}, ${AQUA})`
            }} />
          </div>
          <div style={{ fontFamily: 'M PLUS 1 Code', fontSize: 7, fontWeight: 500, color: 'rgba(10,29,39,0.38)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>
            {unlocked} / {ITEMS.length} collected
          </div>
        </div>

        {/* Coins */}
        <div style={{
          background: TEAL, borderRadius: 7, padding: '4px 9px',
          display: 'flex', alignItems: 'center', gap: 4, flexShrink: 0,
          boxShadow: '0 2px 5px rgba(0,0,0,0.18)'
        }}>
          <div style={{ width: 6, height: 6, borderRadius: '50%', background: CREAM }} />
          <span style={{ fontFamily: 'VT323', fontSize: 15, color: CREAM, lineHeight: 1 }}>1156</span>
        </div>
      </div>

      {/* ── BODY ── */}
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>

        {/* SCROLLABLE GRID */}
        <div style={{
          flex: 1, padding: '10px 10px 10px 14px',
          overflowY: 'auto', overflowX: 'hidden'
        }}>
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(6, 1fr)',
            gap: 8
          }}>
            {ITEMS.map((item) =>
            <Cell key={item.id} item={item} selected={sel?.id === item.id} onClick={setSel} />
            )}
          </div>
        </div>

        {/* ── DETAIL PANEL ── */}
        <div style={{
          width: 210, flexShrink: 0,
          borderLeft: '1px solid rgba(17,78,85,0.1)',
          background: 'rgba(17,78,85,0.04)',
          display: 'flex', flexDirection: 'column',
          overflow: 'hidden'
        }}>
          {sel && <>
            {/* Rarity colour bar */}
            <div style={{ height: 3, background: rc, flexShrink: 0 }} />

            {/* Big graphic */}
            <div style={{
              flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center',
              filter: locked ? 'grayscale(1) brightness(0.55)' : 'none',
              overflow: 'hidden', position: 'relative'
            }}>
              <div style={{ transform: 'scale(1.05)', transformOrigin: 'center center' }}>
                <sel.Gfx />
              </div>
              {locked &&
              <div style={{ position: 'absolute' }}>
                  <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
                    <rect x="8" y="18" width="24" height="18" rx="4" fill={INK} opacity="0.5" />
                    <path d="M13 18V14A7 7 0 0127 14V18" stroke={INK} strokeWidth="3.5" fill="none" strokeLinecap="round" opacity="0.5" />
                  </svg>
                </div>
              }
            </div>

            {/* Info */}
            <div style={{ padding: '8px 12px 12px', flexShrink: 0 }}>
              {/* ID */}
              <div style={{
                fontFamily: 'M PLUS 1 Code', fontSize: 7.5, fontWeight: 500,
                color: 'rgba(10,29,39,0.35)', textTransform: 'uppercase',
                letterSpacing: '0.06em', marginBottom: 3
              }}>
                #{String(sel.id).padStart(3, '0')} · {sel.type}
              </div>

              {/* Name */}
              <div style={{
                fontFamily: 'Lilita One', fontSize: 15,
                color: locked ? 'rgba(10,29,39,0.25)' : INK,
                lineHeight: 1.1, marginBottom: 5
              }}>
                {locked ? '???' : sel.name}
              </div>

              {/* Flavor */}
              <div style={{
                fontFamily: 'Itim', fontSize: 10.5,
                color: locked ? 'rgba(10,29,39,0.2)' : 'rgba(10,29,39,0.65)',
                fontStyle: 'italic', lineHeight: 1.5, marginBottom: 8
              }}>
                {locked ? 'Keep playing to unlock.' : `"${sel.flavor}"`}
              </div>

              {/* Unlock */}
              <div style={{
                background: 'rgba(17,78,85,0.08)', borderRadius: 7,
                padding: '6px 8px',
                display: 'flex', alignItems: 'center', gap: 6
              }}>
                <span style={{ fontSize: 11 }}>{locked ? '🔒' : '✓'}</span>
                <div>
                  <div style={{ fontFamily: 'M PLUS 1 Code', fontSize: 7, fontWeight: 500, color: 'rgba(10,29,39,0.35)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>
                    {locked ? 'unlock condition' : 'unlocked by'}
                  </div>
                  <div style={{ fontFamily: 'Itim', fontSize: 10.5, color: locked ? 'rgb(217,80,42)' : 'rgba(10,29,39,0.8)' }}>
                    {sel.unlock}
                  </div>
                </div>
              </div>
            </div>
          </>}
        </div>
      </div>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
